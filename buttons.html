<style>
  div {
    display: inline-block;
    margin: 4px;
    vertical-align: middle;
  }
</style>

<div>
  <button class="subscribe-button">
    SUBSCRIBE
  </button>

  <style>
    .subscribe-button {
      background-color: rgb(200, 0, 0);
      color: white;
      border: none;
      padding-left:16px;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-right: 16px;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      margin-left: 8px;
      transition: opacity 0.15s;
      vertical-align: top;
    }

    .subscribe-button:hover {
      opacity: 0.8;
    }

    .subscribe-button:active {
      opacity: 0.5;
    }
  </style>
</div>

<div>
  <button class="join-button">
    JOIN
  </button>

  <style>
    .join-button {
      background-color: white;
      border-color: rgb(41, 118, 211);
      border-style: solid;
      border-width: 1px;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      color: rgb(41, 118, 211);
      height: 36px;
      width: 62px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.8s, color 0.8s;
    }

    .join-button:hover {
      background-color: rgb(41, 118, 211);
      color: rgb(255, 255, 255);
    }

    .join-button:active {
      opacity: 0.7;
    }
  </style>
</div>

<div>
  <button class="tweet-button">
    Tweet
  </button>

  <style>
    .tweet-button {
      background-color: rgb(2, 158, 255);
      color: white;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      border: none;
      height: 36px;
      width: 74px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-left: 8px;
      margin-bottom: 0px;
      border-style: solid;
      transition: box-shadow 0.25s;
    }

    .tweet-button:hover {
      box-shadow: 5px 5px 6px rgba(0, 0, 0, 0.15);
    }
  </style>
</div>

<div>
  <button class="request-now-button">
    Request now
  </button>

  <style>
    .request-now-button {
      border-color: rgb(0, 0, 0);
      background-color: rgb(0, 0, 0);
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      color: rgb(255, 255, 255);
      height: 36px;
      width: 105px;
      border-radius: 4px;
      border-style: solid;
      border-width: 1px;
      margin-left: 8px;
      margin-top: 0px;
      font-size: 11px;
      font-weight: bolder;
      cursor: pointer;
      transition: opacity 0.45s, background-color 0.45s, border-color 0.45s, color 0.45s;
    }

    .request-now-button:hover {
      background-color: white;
      border-color: black;
      color: black;
      opacity: 0.55;
    }

    .request-now-button:active {
      color: white;
      transition: color 0.15s;
    }
  </style>
</div>

<div>
  <button class="add-to-cart-button">
    Add to Cart
  </button>

  <style>
    .add-to-cart-button {
      background-color: rgb(255, 216, 20);
      border: none;
      border-radius: 15px;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      height: 32px;
      width: 150px;
      font-size: smaller;
      margin-top: 8px;
      margin-left: 8px;
      cursor: pointer;
      transition: background-color 0.55s;
    }

    .add-to-cart-button:hover {
      background-color: rgb(220, 187, 18);
    }

    .add-to-cart-button:active {
      opacity: 0.25;
      transition: opacity 0.15s;
    }
  </style>
</div>

<div>
  <button class="sign-up-button">
    Sign up
  </button>

  <style>
    .sign-up-button {
      background-color: rgb(86, 192, 116);
      border-color: rgb(86, 192, 116);
      border-style: solid;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      border-radius: 4px;
      border-width: 1px;
      height: 33px;
      width: 85px;
      color: white;
      font-weight: bolder;
      margin-left: 8px;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.25s;
    }

    .sign-up-button:hover {
      box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.15);
    }

    .sign-up-button:active {
      background-color: white;
      border-color: rgb(86, 192, 116);
      color: black;
      transition: color 0.25s, background-color 0.25s, border-color 0.25s;
    }
  </style>
</div>

<div>
  <button class="download-button">
    Download
  </button>

  <style>
    .download-button {
      background-color: rgb(255, 255, 255);
      color: grey;
      border-color: grey;
      border-style: solid;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
        Oxygen, Ubuntu, Cantarell, 'Open Sans', 
        'Helvetica Neue', sans-serif;
      border-width: 1px;
      border-radius: 4px;
      height: 32px;
      width: 105px;
      font-weight: bolder;
      margin-left: 8px;
      margin-top: 8px;
      cursor: pointer;
      transition: background-color 0.35s, color 0.35s;
    }

    .download-button:hover {
      background-color: grey;
      color: white;
    }

    .download-button:active {
      opacity: 0.55;
    }
  </style>
</div>

<div>
  <button class="get-started-button">
    Get started
  </button>

  <style>
    .get-started-button {
      height: 32px;
      width: 105px;
      margin-left: 8px;
      margin-top: 8px;
      border-radius: 4px;
      border-width: 1px;
      font-family: system-ui, -apple-system,
       BlinkMacSystemFont, 'Segoe UI', Roboto,
       Oxygen, Ubuntu, Cantarell, 'Open Sans', 
       'Helvetica Neue', sans-serif;
      background-color: rgb(156, 113, 208);
      border-color: rgb(156, 113, 208);
      border-style: solid;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.55s, color 0.55s;
    }

    .get-started-button:hover {
      background-color: white;
      color: rgb(156, 113, 208)
    }

    .get-started-button:active {
      opacity: 0.55;
      transition: opacity 0.25s;
    }
  </style>
</div>

<div>
  <button class="apply-button">
    Apply on company website
  </button>

  <style>
    .apply-button {
      height: 32px;
      width: 190px;
      margin-top: 8px;
      margin-left: 8px;
      border-radius: 15px;
      border-style: solid;
      border-width: 1px;
      border-color: rgb(74, 74, 237);
      background-color: rgb(74, 74, 237);
      color: white;
      font-family: system-ui, -apple-system, 
      BlinkMacSystemFont, 'Segoe UI',
      Roboto, Oxygen, Ubuntu, Cantarell, 
      'Open Sans', 'Helvetica Neue', 
      sans-serif;
      font-weight: bolder;
      cursor: pointer;
      transition: background-color 0.55s,
       border-width 0.55s, color 0.55s;
    }

    .apply-button:hover {
     background-color: white;
     border-width: 1px;
     color: rgb(74, 74, 237);
    }
  </style>
</div>

<div>
  <button class="save-button">
    Save
  </button>

  <style>
    .save-button {
      height: 32px;
      width: 60px;
      margin-top: 8px;
      margin-left: 4px;
      border-radius: 15px;
      border-width: 1px;
      border-color: rgb(74, 74, 237);
      background-color: white;
      color: rgb(74, 74, 237);
      font-family: system-ui, -apple-system, 
      BlinkMacSystemFont, 'Segoe UI', Roboto, 
      Oxygen, Ubuntu, Cantarell, 'Open Sans', 
      'Helvetica Neue', sans-serif;
      font-weight: bolder;
      transition: background-color 0.55s, color 0.55s;
      cursor: pointer;
    }

    .save-button:hover {
      background-color: rgb(74, 74, 237);
      color: white;
    }

    .save-button:active {
      opacity: 0.75;
    }
  </style>
</div>
